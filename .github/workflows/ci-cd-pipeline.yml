name: Ntsamaela CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18'
  POSTGRES_VERSION: '15'

jobs:
  # Job 1: Code Quality and Security Checks
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Run TypeScript check
        run: npm run type-check
        continue-on-error: true

      - name: Security audit
        run: npm run security:audit
        continue-on-error: true

  # Job 2: Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ntsamaela_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Setup test environment
        run: |
          cp env.example apps/api/.env.test || echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/ntsamaela_test" > apps/api/.env.test
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/ntsamaela_test" >> apps/api/.env.test
          echo "REDIS_URL=redis://localhost:6379" >> apps/api/.env.test
          echo "JWT_SECRET=test-jwt-secret" >> apps/api/.env.test
          echo "ADMIN_JWT_SECRET=test-admin-jwt-secret" >> apps/api/.env.test
          echo "NODE_ENV=test" >> apps/api/.env.test
          echo "DISABLE_PRISMA=false" >> apps/api/.env.test

      - name: Run database migrations
        run: |
          cd apps/api
          npm run migrate:test || echo "Migrations skipped"
        continue-on-error: true

      - name: Run API unit tests
        run: npm run test:api
        continue-on-error: true

  # Job 3: Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ntsamaela_integration_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Setup test environment
        run: |
          cp env.example apps/api/.env.test || echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/ntsamaela_integration_test" > apps/api/.env.test
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/ntsamaela_integration_test" >> apps/api/.env.test
          echo "REDIS_URL=redis://localhost:6379" >> apps/api/.env.test
          echo "JWT_SECRET=test-jwt-secret" >> apps/api/.env.test
          echo "ADMIN_JWT_SECRET=test-admin-jwt-secret" >> apps/api/.env.test
          echo "NODE_ENV=test" >> apps/api/.env.test
          echo "DISABLE_PRISMA=false" >> apps/api/.env.test

      - name: Run database migrations
        run: |
          cd apps/api
          npm run migrate:test || echo "Migrations skipped"
        continue-on-error: true

      - name: Run integration tests
        run: npm run test:integration:api
        continue-on-error: true

  # Job 4: Performance Tests
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ntsamaela_perf_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Setup test environment
        run: |
          cp env.example apps/api/.env.test || echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/ntsamaela_perf_test" > apps/api/.env.test
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/ntsamaela_perf_test" >> apps/api/.env.test
          echo "REDIS_URL=redis://localhost:6379" >> apps/api/.env.test
          echo "JWT_SECRET=test-jwt-secret" >> apps/api/.env.test
          echo "ADMIN_JWT_SECRET=test-admin-jwt-secret" >> apps/api/.env.test
          echo "NODE_ENV=test" >> apps/api/.env.test
          echo "DISABLE_PRISMA=false" >> apps/api/.env.test

      - name: Run database migrations
        run: |
          cd apps/api
          npm run migrate:test || echo "Migrations skipped"
        continue-on-error: true

      - name: Run performance tests
        run: npm run test:performance
        continue-on-error: true

  # Job 5: Build Docker Images (verify builds work)
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: false
          tags: ntsamaela-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web Admin Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web-admin/Dockerfile
          push: false
          tags: ntsamaela-web-admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build verification notice
        run: |
          echo "✅ Docker images built successfully"
          echo "Railway will handle deployment automatically via GitHub integration"
          echo "Check Railway dashboard for deployment status after push"
